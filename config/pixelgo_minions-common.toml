#General minion behaviour.
[general]
	#Multiplies every cooldown below. 0.5 makes all minions twice as fast, 2.0 twice as slow.
	# Default: 1.0
	# Range: 0.01 ~ 100.0
	speedMultiplier = 0.75
	#Actions needed for one resource. Hypixel minions place a block, then harvest it: 2 actions.
	# Default: 2
	# Range: 1 ~ 10
	actionsPerResource = 2

#Fuel placed in the minion's fuel slot.
[fuel]
	#When false the fuel slot rejects everything and no speed boost is applied.
	enabled = true

#Production while the chunk is unloaded or the world is closed.
[offline]
	#Minions catch up on the time they missed the next time their chunk loads.
	enabled = true
	#Also count time the world was not running at all, from the system clock.
	#With this off, only ticks the server actually ran are caught up.
	useRealTime = true
	#Longest stretch a single minion may catch up on, in hours.
	# Default: 24.0
	# Range: 0.0 ~ 720.0
	maxHours = 24.0

#The area the minion needs free around itself to work in.
[workArea]
	#Require free working space around the minion. With this off it produces anywhere.
	enabled = true
	#Radius in blocks around the minion. 2 is the 5x5 area of Hypixel SkyBlock.
	# Default: 2
	# Range: 1 ~ 8
	radius = 2

#Seconds between two actions, and how much one harvest is worth, per minion.
#A resource comes out every 'actionsPerResource' actions, so the time between
#two harvests is this value times that number.
#secondsAtTier1 applies at tier I, secondsAtMaxTier at the minion's highest tier,
#and the tiers in between are spread evenly across the two.
#itemsPerHarvestMin/Max are how many of the minion's own resource one harvest
#yields: a redstone minion pulls 3 to 6 out of the ore, a diamond minion 1.
#Side drops always come one at a time.
[cooldowns]

	[cooldowns.cobblestone]
		# Default: 14.0
		# Range: 0.05 ~ 86400.0
		secondsAtTier1 = 14.0
		# Default: 6.0
		# Range: 0.05 ~ 86400.0
		secondsAtMaxTier = 6.0
		# Default: 1
		# Range: 1 ~ 64
		itemsPerHarvestMin = 1
		# Default: 1
		# Range: 1 ~ 64
		itemsPerHarvestMax = 1

