#Who a placed minion belongs to, and how many one player may have out.
[ownership]
	#Most minions one player may have placed in the world at once. 0 for no limit.
	#Picking a minion back up frees its slot straight away.
	# Default: 20
	# Range: 0 ~ 1000
	maxPerPlayer = 20
	#Only the player who placed a minion may open its menu.
	#With this off anyone can open any minion; the limit above still applies.
	protectOthers = true
	#Server operators may open anyone's minion, so an admin can clean one up.
	#This does not lift the limit above for them.
	operatorsBypass = true
