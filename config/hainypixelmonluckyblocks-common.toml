[common]
	#Poids relatif de ce tier dans le tirage du Sillage de Chance (voir la section
	#[sillage_de_chance]) : quand un bloc du paquet est tire, la chance que ce soit CE tier
	#est proportionnelle a ce nombre par rapport a la somme des poids de tous les tiers.
	#N'est PAS une probabilite en soi (pas besoin de rester entre 0 et 1).
	# Default: 0.005
	# Range: 0.0 ~ 1000.0
	tierWeight = 0.05
	#Probabilite (entre 0.0 et 1.0) que le Pokemon obtenu soit une espece legendaire/mythique/Ultra-Chimere.
	#Le niveau et les IV restent ceux de ce tier quoi qu'il arrive : seule l'espece change.
	# Default: 0.02
	# Range: 0.0 ~ 1.0
	legendaryChance = 0.008
	#Probabilite (entre 0.0 et 1.0) que le Pokemon obtenu soit shiny.
	#Tiree independamment de legendaryChance : un Pokemon peut etre legendaire ET shiny a la fois.
	# Default: 0.005
	# Range: 0.0 ~ 1.0
	shinyChance = 0.005
	#Niveau minimum du Pokemon recompense par ce bloc.
	# Default: 2
	# Range: 1 ~ 100
	levelMin = 1
	#Niveau maximum du Pokemon recompense par ce bloc.
	# Default: 12
	# Range: 1 ~ 100
	levelMax = 100
	#IV minimum (par statistique, de 0 a 31) du Pokemon recompense par ce bloc.
	# Default: 0
	# Range: 0 ~ 31
	ivMin = 0
	#IV maximum (par statistique, de 0 a 31) du Pokemon recompense par ce bloc.
	# Default: 15
	# Range: 0 ~ 31
	ivMax = 31

