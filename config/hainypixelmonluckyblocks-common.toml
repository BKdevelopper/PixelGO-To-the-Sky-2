[sillage_de_chance]
	#Tous les combien de blocs de distance REELLEMENT parcourue (un joueur immobile n'accumule
	#jamais rien) un jet de probabilite de declenchement a lieu.
	# Default: 75.0
	# Range: 1.0 ~ 10000.0
	checkpointDistanceBlocks = 75.0
	#La probabilite de declenchement a chaque checkpoint = min(1.0, jauge / ce nombre).
	#Palier garanti : une fois la jauge a ce niveau (ou au-dela), le declenchement suivant est
	#certain (100%) -- un filet de securite pour eviter une secheresse infinie.
	# Default: 12000.0
	# Range: 1.0 ~ 1000000.0
	guaranteedThresholdBlocks = 12000.0
	#Fraction de la jauge conservee apres un declenchement REUSSI (au moins 1 bloc place) :
	#la jauge n'est jamais remise a 0, seulement multipliee par ce nombre. Evite a la fois les
	#declenchements rapproches ("paquets") et les secheresses trop dures apres un palier garanti.
	# Default: 0.01
	# Range: 0.0 ~ 1.0
	gaugeRetentionFraction = 0.01
	#Poids relatif d'obtenir exactement 1 bloc quand un declenchement a lieu.
	# Default: 70
	# Range: 0 ~ 1000
	packSizeOneWeight = 70
	#Poids relatif d'obtenir exactement 2 blocs quand un declenchement a lieu.
	# Default: 25
	# Range: 0 ~ 1000
	packSizeTwoWeight = 25
	#Poids relatif d'obtenir exactement 3 blocs quand un declenchement a lieu.
	# Default: 18
	# Range: 0 ~ 1000
	packSizeThreeWeight = 18
	#Duree (en minutes) apres laquelle le waypoint JourneyMap d'un bloc chanceux jamais casse
	#est retire automatiquement (evite d'accumuler des waypoints fantomes). Le bloc lui-meme
	#n'est PAS retire du monde : il reste cassable normalement, seul le waypoint expire.
	# Default: 45
	# Range: 1 ~ 100000
	waypointTimeoutMinutes = 45
	#Evenement qualificatif du bloc Jackpot : un paquet de taille 3 ou les 3 tirages de tier
	#tombent sur Commun (deja tres rare avec les poids par defaut). Si cet evenement a lieu, ce
	#pourcentage (0.0 a 1.0) decide si ca debouche sur un vrai Jackpot (1 bloc Jackpot pose a la
	#place des 3 blocs Commun normaux) ou juste 3 blocs Commun comme d'habitude.
	# Default: 0.6
	# Range: 0.0 ~ 1.0
	jackpotChanceOnTripleCommon = 0.6
	#A l'interieur d'un Jackpot deja declenche (voir jackpotChanceOnTripleCommon ci-dessus) :
	#ce pourcentage (0.0 a 1.0) decide si c'est un Super Jackpot (tout le contenu double, y
	#compris un 2e Pokemon legendaire tire independamment) a la place d'un Jackpot normal.
	# Default: 0.2
	# Range: 0.0 ~ 1.0
	superJackpotChance = 0.2
	#Pour un Jackpot NORMAL (pas Super) uniquement : poids relatif de l'option 'Pokemon
	#legendaire shiny IV parfaits' parmi les 3 options possibles (une seule est donnee).
	# Default: 1
	# Range: 0 ~ 1000
	jackpotOptionPokemonWeight = 1
	#Poids relatif de l'option 'lot d'objets' (Master Ball, Rare Candy, etc.).
	# Default: 1
	# Range: 0 ~ 1000
	jackpotOptionItemLotWeight = 1
	#Poids relatif de l'option 'lot de 5 Lucky Blocks bonus'.
	# Default: 1
	# Range: 0 ~ 1000
	jackpotOptionLuckyBlockLotWeight = 1
