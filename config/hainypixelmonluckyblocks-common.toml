[item]
	#Poids relatif de ce tier dans le tirage du Sillage de Chance (voir la section [sillage_de_chance]).
	#N'est PAS une probabilite en soi (pas besoin de rester entre 0 et 1). Sans rapport avec les 4
	#poids commonWeight/uncommonWeight/rareWeight/veryRareWeight ci-dessous, qui choisissent
	#l'item DONNE par ce bloc une fois casse, pas ce bloc lui-meme.
	# Default: 0.003
	# Range: 0.0 ~ 1000.0
	tierWeight = 0.03
	#Poids relatif du tier d'item 'Commun' dans le tirage pondere (0 = ce tier ne sera jamais tire).
	#Plus ce nombre est grand par rapport aux autres poids, plus ce tier a de chances d'etre tire.
	# Default: 60
	# Range: 0 ~ 1000
	commonWeight = 60
	#Poids relatif du tier d'item 'Peu commun' dans le tirage pondere.
	# Default: 30
	# Range: 0 ~ 1000
	uncommonWeight = 30
	#Poids relatif du tier d'item 'Rare' dans le tirage pondere.
	# Default: 8
	# Range: 0 ~ 1000
	rareWeight = 8
	#Poids relatif du tier d'item 'Tres rare' dans le tirage pondere.
	# Default: 2
	# Range: 0 ~ 1000
	veryRareWeight = 2
	#Dans le tier 'Peu commun' uniquement : poids relatif de la categorie 'Mint de nature'
	#(25 natures possibles, tirees ensuite a poids egal entre elles) par rapport aux AUTRES
	#items concrets de ce tier, qui pesent chacun 1 (fixe, non configurable).
	# Default: 1
	# Range: 0 ~ 1000
	uncommonMintWeight = 1

